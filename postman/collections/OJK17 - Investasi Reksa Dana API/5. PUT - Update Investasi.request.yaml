$kind: http-request
description: |-
  Mengupdate data investasi dengan id=1. Ganti angka 1 di URL dengan id investasi yang ingin diupdate.

  Field sama seperti POST.
url: http://127.0.0.1:8000/investments/1
method: PUT
headers:
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: _token
      value: "{{csrf_token}}"
    - key: _method
      value: PUT
    - key: nama_produk
      value: Bibit Reksa Dana A (Updated)
    - key: jenis_reksa_dana
      value: Saham
      description: "Pilihan: Pasar Uang | Pendapatan Tetap | Saham | Campuran"
    - key: manajer_investasi
      value: PT Manajer X Updated
    - key: tanggal_pembelian
      value: 2026-11-22
    - key: jumlah_unit
      value: "2000"
    - key: harga_per_unit
      value: "1500"
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest("http://127.0.0.1:8000/investments/1/edit", function (err, res) {
          const match = res.text().match(/name="_token" value="([^"]+)"/);
          if (match) {
              pm.variables.set("csrf_token", match[1]);
          }
      });
    language: text/javascript
order: 5000
