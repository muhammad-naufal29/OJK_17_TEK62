$kind: http-request
description: Menghapus data investasi dengan id=1. Ganti angka 1 di URL dengan id investasi yang ingin dihapus.
url: http://127.0.0.1:8000/investments/1
method: DELETE
headers:
  Accept: application/json
body:
  type: urlencoded
  content:
    _token: "{{csrf_token}}"
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest("http://127.0.0.1:8000/investments", function (err, res) {
          const match = res.text().match(/name="_token" value="([^"]+)"/);
          if (match) {
              pm.variables.set("csrf_token", match[1]);
          }
      });
    language: text/javascript
order: 6000
